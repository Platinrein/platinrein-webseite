name: Auto Deploy to Checkdomain

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest
    steps:
      - name: 1. Code auschecken
        uses: actions/checkout@v4

      - name: 2. Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Abhängigkeiten installieren
        run: npm ci

      - name: 4. Website bauen (Production Build)
        run: npm run build

      - name: 5. Automatisch per FTP auf Checkdomain hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./htdocs/
